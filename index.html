<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Pocket Tools rassemble les mini-apps publiques d’Antoine Terrade."
    />
    <meta name="theme-color" content="#110f0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pocket" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>Pocket — mini-apps</title>
  </head>
  <body>
    <a class="skip" href="#list">Aller aux apps</a>
    <div class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Antoine Terrade</p>
          <h1>Pocket</h1>
          <p class="lede">
            Les mini-apps que je sors pour un besoin précis. Tout est public.
            Les favoris restent sur cet appareil.
          </p>
        </div>
        <div class="hero-actions">
          <button class="install" id="install" type="button">Installer</button>
          <a class="profile" href="https://github.com/TonyLaPoche">GitHub</a>
        </div>
      </header>

      <div class="toolbar">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" />
            <path d="M16 16.5L20 20.5" />
          </svg>
          <input
            id="search"
            type="search"
            placeholder="Chercher une app"
            autocomplete="off"
            enterkeyhint="search"
            aria-label="Chercher une app"
          />
          <button id="clear-search" type="button" hidden aria-label="Effacer la recherche">
            ×
          </button>
        </div>
        <div id="chips" class="chips" role="group" aria-label="Filtrer"></div>
        <p class="status">
          <span id="count">10 apps</span>
          <span>Étoile pour épingler</span>
        </p>
      </div>

      <main>
        <div id="list" class="grid"></div>
        <p id="empty" class="empty" hidden>Aucune app pour cette recherche.</p>
      </main>

      <footer class="site-footer">
        <span>© 2026 Antoine Terrade</span>
        <a href="https://antoineterrade.com/">Portfolio</a>
        <a href="https://github.com/TonyLaPoche">github.com/TonyLaPoche</a>
      </footer>
    </div>

    <dialog id="install-dialog" aria-labelledby="install-title">
      <h2 id="install-title">Installer Pocket</h2>
      <p id="install-copy"></p>
      <button id="install-close" type="button">Fermer</button>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
